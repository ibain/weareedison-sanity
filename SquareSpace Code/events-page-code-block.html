<!-- Events (Sanity) – Squarespace-style version -->
<section id="sanity-events"></section>

<dialog id="event-lightbox" aria-label="Full-size event image">
  <button
    type="button"
    class="event-lightbox-close"
    aria-label="Close image"
  >
    &times;
  </button>

  <img id="event-lightbox-image" src="" alt="" />
</dialog>

<style>
  /* Clickable Event Images */
  #sanity-events .event-image-trigger {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    appearance: none;
    background: transparent;
    cursor: zoom-in;
  }

  /* Full-Screen Lightbox */
  #event-lightbox {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    overflow: hidden;
  }

  #event-lightbox[open] {
    display: grid;
    place-items: center;
  }

  #event-lightbox::backdrop {
    background: rgba(0, 0, 0, 0.9);
  }

  #event-lightbox-image {
    display: block;
    max-width: 92vw;
    max-height: 88vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
  }

  .event-lightbox-close {
    position: fixed;
    top: 16px;
    right: 22px;
    z-index: 2;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 44px;
    line-height: 1;
    cursor: pointer;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const SANITY_URL = 'https://u8cybb7l.api.sanity.io/v2024-01-01/data/query/production';
  const GROQ = `
    *[_type=="events" && defined(startDate) && (
        (defined(endDate) && endDate >= now()) ||
        (!defined(endDate) && startDate >= now())
      )]
      | order(startDate asc){
        _id, title, startDate, endDate, displayTime, location, locationLink, excerpt, sourceUrl, linkButtonTitle, browserJoinEnabled,
        "img": image.asset->url, "alt": coalesce(image.alt, title)
      }
  `;

  const isZoom = (u) => {
    try {
      const h = new URL(u, location.origin).hostname.toLowerCase();
      return h === 'zoom.us' || h.endsWith('.zoom.us');
    } catch {
      return false;
    }
  };

  const imgUrl = (u, w = 1200, h = 750) => (u ? `${u}?auto=format&fit=crop&w=${w}&h=${h}` : '');

  const escapeHtml = (value) => String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const applyMarks = (text, marks, markDefs) => (marks || []).reduce((node, mark) => {
    if (mark === 'strong') return `<strong class="event-rich-strong">${node}</strong>`;
    if (mark === 'em') return `<em class="event-rich-em">${node}</em>`;
    const def = markDefs[mark];
    if (def && def._type === 'link' && def.href) {
      return `<a class="event-rich-link" href="${escapeHtml(def.href)}" target="_blank" rel="noopener noreferrer">${node}</a>`;
    }
    return node;
  }, text);

  const renderSpans = (children, markDefs) => (children || []).map((child) => {
    if (child._type !== 'span') return '';
    const raw = child.text || '';
    if (!raw) return '';
    const text = escapeHtml(raw).replace(/\n/g, '<br>');
    return applyMarks(text, child.marks, markDefs);
  }).join('');

  const portableTextToHtml = (blocks) => {
    if (!Array.isArray(blocks) || !blocks.length) return '';

    const markDefs = {};
    let html = '';
    let inList = false;

    const closeList = () => {
      if (inList) {
        html += '</ul>';
        inList = false;
      }
    };

    blocks.forEach((block) => {
      if (block._type !== 'block') return;

      (block.markDefs || []).forEach((def) => {
        if (def._key) markDefs[def._key] = def;
      });

      const inner = renderSpans(block.children, markDefs);
      if (!inner.trim()) return;

      if (block.listItem === 'bullet') {
        if (!inList) {
          closeList();
          html += '<ul>';
          inList = true;
        }
        html += `<li>${inner}</li>`;
        return;
      }

      closeList();
      html += `<p>${inner}</p>`;
    });

    closeList();
    return html;
  };

  const renderExcerpt = (excerpt) => {
    if (!excerpt) return '';

    if (typeof excerpt === 'string') {
      const text = escapeHtml(excerpt).replace(/\n/g, '<br>');
      return text ? `<div class="event-excerpt"><p>${text}</p></div>` : '';
    }

    if (Array.isArray(excerpt)) {
      const html = portableTextToHtml(excerpt);
      return html ? `<div class="event-excerpt">${html}</div>` : '';
    }

    return '';
  };

  async function fetchEvents() {
    const res = await fetch(SANITY_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ query: GROQ }),
    });
    if (!res.ok) throw new Error('Sanity query failed');
    const { result = [] } = await res.json();
    return result;
  }

  function bindLightbox(root, list) {
    const lightbox = document.getElementById('event-lightbox');
    const lightboxImage = document.getElementById('event-lightbox-image');
    const closeButton = lightbox.querySelector('.event-lightbox-close');

    root.querySelectorAll('.event-image-trigger').forEach((button) => {
      button.addEventListener('click', () => {
        const selectedEvent = list[Number(button.dataset.eventIndex)];

        lightboxImage.src = selectedEvent.img;
        lightboxImage.alt = selectedEvent.alt || selectedEvent.title || 'Event image';
        lightbox.showModal();
      });
    });

    closeButton.addEventListener('click', () => {
      lightbox.close();
    });

    lightbox.addEventListener('click', (clickEvent) => {
      if (clickEvent.target === lightbox) {
        lightbox.close();
      }
    });

    lightbox.addEventListener('close', () => {
      lightboxImage.src = '';
      lightboxImage.alt = '';
    });
  }

  function render(list) {
    const root = document.getElementById('sanity-events');
    if (!list.length) {
      root.innerHTML = '<p>No upcoming events.</p>';
      return;
    }

    root.innerHTML = list.map((ev, index) => {
      const start = new Date(ev.startDate);
      const end = ev.endDate ? new Date(ev.endDate) : null;
      const sameDay = end && start.toDateString() === end.toDateString();
      const hasStartTime = ev.displayTime !== false && (start.getHours() !== 0 || start.getMinutes() !== 0);
      const hasEndTime = end && ev.displayTime !== false && (end.getHours() !== 0 || end.getMinutes() !== 0);

      let when = '';
      if (sameDay) {
        when = start.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        if (hasStartTime) {
          when += ` • ${start.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true })}`;
          if (hasEndTime) {
            when += ` - ${end.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true })}`;
          }
        }
      } else if (end) {
        when = `${start.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })} - ${end.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;
        if (hasStartTime && hasEndTime) {
          when += ` • ${start.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true })} - ${end.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }
      } else {
        when = start.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        if (hasStartTime) {
          when += ` • ${start.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }
      }

      const where = ev.location
        ? `${ev.location}${ev.locationLink ? ` <a href="${ev.locationLink}" target="_blank" rel="noopener">(map)</a>` : ''}`
        : '';
      const zoom = ev.sourceUrl && isZoom(ev.sourceUrl);
      const hasExternalLink = ev.sourceUrl && !isZoom(ev.sourceUrl);
      const buttonTitle = ev.linkButtonTitle || 'Would you like to know more?';

      return `
        <article>
          <figure>
            ${ev.img ? `
              <button
                type="button"
                class="event-image-trigger"
                data-event-index="${index}"
                aria-label="View event image full size"
              >
                <img
                  src="${imgUrl(ev.img)}"
                  alt="${(ev.alt || '').replace(/"/g, '&quot;')}"
                />
              </button>
            ` : ''}
          </figure>
          <div class="content">
            <h3>${ev.title || ''}</h3>
            <div class="meta">
              <div>${when}</div>
              ${where ? `<div>${where}</div>` : ''}
            </div>
            ${renderExcerpt(ev.excerpt)}

            ${ev.browserJoinEnabled ? `
              <div class="sqs-block-button-container sqs-block-button-container--left">
                <div class="sqs-block-button">
                  <a class="sqs-block-button-element sqs-button-element--primary sqs-button-element--medium"
                     href="https://meet.weareedison.org/">Join in your browser</a>
                </div>
              </div>
            ` : ''}

            ${zoom ? `
              <div class="sqs-block-button-container sqs-block-button-container--left" data-zoom-row="1" data-alignment="left">
                <div class="sqs-block-button">
                  <a
                    class="sqs-block-button-element sqs-button-element--primary sqs-button-element--medium"
                    href="${ev.sourceUrl}" target="_blank" rel="noopener"
                  >
                    Join hybrid via Zoom
                  </a>
                </div>
              </div>
            ` : hasExternalLink ? `
              <div class="sqs-block-button-container sqs-block-button-container--left" data-zoom-row="1" data-alignment="left">
                <div class="sqs-block-button">
                  <a
                    class="sqs-block-button-element sqs-button-element--primary sqs-button-element--medium"
                    href="${ev.sourceUrl}" target="_blank" rel="noopener"
                  >
                    ${buttonTitle}
                  </a>
                </div>
              </div>
            ` : ''}
          </div>
        </article>
      `;
    }).join('');

    bindLightbox(root, list);
  }

  fetchEvents().then(render).catch((err) => {
    console.error(err);
    const root = document.getElementById('sanity-events');
    root.innerHTML = '<p>Sorry, events failed to load.</p>';
  });
});
</script>
