<!--
  Squarespace → Settings → Advanced → Code Injection → FOOTER
  Paste this entire file, including the <script> tags.

  Shows a "Join PTA meeting" pill while meet.weareedison.org reports the join
  window is open. Schedule comes from Sanity → Meeting Settings.

  No polling. The status payload carries absolute timestamps, so this script
  fetches once per page load and then sleeps until the next window boundary.
  A typical visitor costs one request.
-->
<script>
(function () {
  var MEET_STATUS_URL = 'https://meet.weareedison.org/api/zoom/status';
  var MEET_JOIN_URL = 'https://meet.weareedison.org/';
  var BANNER_ID = 'edison-meet-banner';

  /* Wake up at least this often so a sleeping tab or clock drift can't strand us. */
  var MAX_SLEEP_MS = 30 * 60 * 1000;
  var MIN_SLEEP_MS = 15 * 1000;
  /* Re-fetch rather than reuse cached status once it is this old. */
  var STALE_AFTER_MS = 5 * 60 * 1000;

  /* Edison brand palette — matches the calendar dialog's yellow panel + blue border. */
  var BRAND_YELLOW = '#FFDE6C';
  var BRAND_LIGHT_BLUE = '#90CAF9';
  var BRAND_INK = '#354874';

  var STYLE_ID = 'edison-meet-banner-style';

  var state = { data: null, fetchedAt: 0 };
  var timer = null;

  function ensureStyles() {
    if (document.getElementById(STYLE_ID)) return;

    var style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = [
      '@keyframes edison-meet-rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}',
      /* A white ring sits under the pulse so the yellow pill stays distinct
         even when it floats over the brand yellow panels. */
      '@keyframes edison-meet-pulse{0%{box-shadow:0 0 0 4px #fff,0 10px 30px rgba(53,72,116,.3),0 0 0 4px rgba(95,156,255,.85)}70%{box-shadow:0 0 0 4px #fff,0 10px 30px rgba(53,72,116,.3),0 0 0 20px rgba(95,156,255,0)}100%{box-shadow:0 0 0 4px #fff,0 10px 30px rgba(53,72,116,.3),0 0 0 4px rgba(95,156,255,0)}}',
      '@keyframes edison-meet-blink{0%,100%{opacity:1}50%{opacity:.35}}',
      '#' + BANNER_ID + '{animation:edison-meet-rise .45s ease-out both}',
      '#' + BANNER_ID + ' .edison-meet-pill{animation:edison-meet-pulse 2.6s ease-out infinite}',
      '#' + BANNER_ID + ' .edison-meet-pill:hover{transform:translateY(-2px)}',
      '#' + BANNER_ID + ' .edison-meet-dot{animation:edison-meet-blink 1.4s ease-in-out infinite}',
      '@media (prefers-reduced-motion:reduce){#' +
        BANNER_ID +
        ',#' +
        BANNER_ID +
        ' .edison-meet-pill,#' +
        BANNER_ID +
        ' .edison-meet-dot{animation:none}}',
    ].join('');

    document.head.appendChild(style);
  }

  function ensureBanner(label) {
    var existing = document.getElementById(BANNER_ID);
    if (existing) return existing;

    ensureStyles();

    var banner = document.createElement('div');
    banner.id = BANNER_ID;
    banner.style.cssText =
      'display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,560px);width:100%;';

    var link = document.createElement('a');
    link.className = 'edison-meet-pill';
    link.href = MEET_JOIN_URL;
    link.style.cssText =
      'display:flex;align-items:center;justify-content:center;gap:10px;' +
      'background:' + BRAND_YELLOW + ';color:' + BRAND_INK + ';' +
      'border:4px solid ' + BRAND_INK + ';' +
      'box-shadow:0 0 0 4px #fff,0 10px 30px rgba(53,72,116,.3);' +
      'font-family:Overpass,system-ui,sans-serif;font-weight:800;letter-spacing:.02em;' +
      'font-size:clamp(.95rem,2.2vw,1.08rem);text-transform:uppercase;text-decoration:none;' +
      'padding:15px 26px;border-radius:999px;transition:transform .18s ease;';

    var dot = document.createElement('span');
    dot.className = 'edison-meet-dot';
    dot.setAttribute('aria-hidden', 'true');
    dot.style.cssText =
      'flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:' +
      BRAND_INK +
      ';';

    var text = document.createElement('span');
    text.className = 'edison-meet-text';
    text.textContent = label;

    link.appendChild(dot);
    link.appendChild(text);
    banner.appendChild(link);
    document.body.appendChild(banner);
    return banner;
  }

  function setVisible(visible, label) {
    if (!visible) {
      var existing = document.getElementById(BANNER_ID);
      if (existing) existing.style.display = 'none';
      return;
    }
    var banner = ensureBanner(label);
    banner.querySelector('.edison-meet-text').textContent = label;
    banner.style.display = 'block';
  }

  function ms(value) {
    var parsed = value ? Date.parse(value) : NaN;
    return isNaN(parsed) ? null : parsed;
  }

  /**
   * Recompute open/closed locally from the payload timestamps, and report when
   * the answer could next change.
   */
  function evaluate(data, now) {
    if (!data || !data.configured || data.enabled === false) {
      return { open: false, nextChangeAt: null };
    }

    var win = data.window;
    var start = win ? ms(win.openStartsAt) : null;
    var end = win ? ms(win.openEndsAt) : null;
    var next = win ? ms(win.nextOpenAt) : null;

    /* No usable window ("always" mode, or a zero-length one) — trust the flag. */
    if (start === null || end === null || end <= start) {
      return { open: data.open === true, nextChangeAt: null };
    }

    if (now >= start && now <= end) {
      return { open: true, nextChangeAt: end };
    }

    var upcoming = next !== null && next > now ? next : null;
    if (upcoming === null && start !== null && start > now) upcoming = start;

    return { open: false, nextChangeAt: upcoming };
  }

  function schedule(delayMs, refetch) {
    if (timer) clearTimeout(timer);
    var wait = Math.max(MIN_SLEEP_MS, Math.min(delayMs, MAX_SLEEP_MS));
    timer = setTimeout(function () {
      timer = null;
      if (refetch || Date.now() - state.fetchedAt > STALE_AFTER_MS) {
        load();
      } else {
        render();
      }
    }, wait);
  }

  /* Titles are authored freely in Sanity, so only add "Join" when it's missing. */
  function pillLabel(data) {
    var title = data && data.title ? String(data.title).trim() : '';
    if (!title) return 'Join PTA meeting in your browser';
    if (/^join\b/i.test(title)) return title.replace(/[.!]+$/, '');
    return 'Join ' + title + ' in your browser';
  }

  function render() {
    var now = Date.now();
    var result = evaluate(state.data, now);
    var label = pillLabel(state.data);

    setVisible(result.open, label);

    if (result.nextChangeAt === null) {
      /* Nothing scheduled ahead — check again on the next long interval only. */
      schedule(MAX_SLEEP_MS, true);
      return;
    }

    /* Land just past the boundary so the recomputation flips cleanly. */
    schedule(result.nextChangeAt - now + 1000, false);
  }

  function load() {
    fetch(MEET_STATUS_URL, { credentials: 'omit' })
      .then(function (res) {
        return res.json();
      })
      .then(function (data) {
        state.data = data;
        state.fetchedAt = Date.now();
        render();
      })
      .catch(function () {
        setVisible(false);
        schedule(MAX_SLEEP_MS, true);
      });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - state.fetchedAt > STALE_AFTER_MS) load();
    else render();
  });

  load();
})();
</script>
